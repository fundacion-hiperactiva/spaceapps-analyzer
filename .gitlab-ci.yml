image: node:24-bookworm-slim

stages:
  - test

variables:
  PNPM_STORE_DIR: .pnpm-store

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

check:
  stage: test
  before_script:
    - corepack enable
    - corepack prepare pnpm@12.9.1 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  script:
    - pnpm check
